<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ghar Tracker</title>
<meta name="description" content="Track milk, newspaper, water cans, eggs and other daily household items — quantities, rates, and monthly bills, automatically.">
<meta name="theme-color" content="#2f6f5e">

<!-- Favicons -->
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Link preview (Open Graph / Twitter Card) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Ghar Tracker">
<meta property="og:description" content="Track milk, newspaper, water cans, eggs and other daily household items — quantities, rates, and monthly bills, automatically.">
<meta property="og:image" content="og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ghar Tracker">
<meta name="twitter:description" content="Track milk, newspaper, water cans, eggs and other daily household items — quantities, rates, and monthly bills, automatically.">
<meta name="twitter:image" content="og-image.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOCK SCREEN -->
  <div id="lockScreen" class="screen">
    <div class="lock-box">
      <div class="lock-emoji">🏠</div>
      <h1 id="lockTitle">Enter passcode</h1>
      <p id="lockSub" class="muted">Unlock your tracker</p>
      <input id="lockInput" type="password" inputmode="numeric" placeholder="••••" autocomplete="off">
      <button id="lockBtn" class="btn-primary">Unlock</button>
      <p id="lockError" class="error-text"></p>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="screen hidden">
    <header class="topbar">
      <h1 id="pageTitle">Today</h1>
      <button id="logoutBtn" class="icon-btn" title="Lock">🔒</button>
    </header>

    <main id="main">

      <!-- TODAY TAB -->
      <section id="tab-today" class="tab">
        <div class="today-summary" id="todaySummary"></div>
        <div id="itemsList" class="items-list"></div>
        <div id="emptyToday" class="empty-state hidden">
          <p>No items yet.</p>
          <p class="muted">Add milk, newspaper, water cans, eggs — anything you get regularly.</p>
          <button class="btn-primary" onclick="goTab('items')">+ Add your first item</button>
        </div>
      </section>

      <!-- HISTORY TAB -->
      <section id="tab-history" class="tab hidden">
        <div class="month-nav">
          <button id="prevMonth" class="icon-btn">‹</button>
          <div id="monthLabel" class="month-label"></div>
          <button id="nextMonth" class="icon-btn">›</button>
        </div>
        <div class="month-total-card" id="monthTotalCard"></div>
        <div id="historyList" class="history-list"></div>
        <button id="exportBtn" class="btn-secondary full-width">⬇ Export month (CSV)</button>
      </section>

      <!-- ITEMS TAB -->
      <section id="tab-items" class="tab hidden">
        <button id="addItemBtn" class="btn-primary full-width">+ Add new item</button>
        <div id="manageList" class="manage-list"></div>
      </section>

    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="today"><span>🏠</span>Today</button>
      <button class="nav-btn" data-tab="history"><span>📅</span>History</button>
      <button class="nav-btn" data-tab="items"><span>⚙️</span>Items</button>
    </nav>
  </div>

  <!-- MODAL (item add/edit, qty override, rate/qty change) -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
